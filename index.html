<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <title>Tickethack</title>
</head>

<body>
  <div id="container">
    <div id = "header">
        <div id = "logo-container">
            Tickethack
        </div>
        <button type ="button" id="btn-cart">Cart</button>
        <button type ="button" id="btn-bookings">Bookings</button>
    </div>
    <div id = "content">
        <div id = "maintext">
            <section><h1>Explore the world effortlessly by train!</h1><p>Compare, book and enjoy cheap prices for train tickets: your journey starts on Tickethack.</p></section>
        </div>
        <div id= "cards">
            <div id = "card-left">
                <div><input id="depart" type= "text" placeholder ="Departure" />
                <input id="arrivee" type= "text" placeholder ="Arrival" /></div>

                <div><input id="date" type="date" /></div>
                <div><button type="button" id="btn-search">Recherche</button></div>
            </div>
            <div id = "card-right">
                <div class="trip">
                    <img id = 'train' src='./images/train.png'>
                    <p id='bookyourtrip'>Il est temps de réserver votre prochain voyage.</p>
                </div>
            </div>
        </div>
    </div>
  </div>  
   <script src="script.js"></script> 
</body>
</html>
