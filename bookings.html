<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylecartbook.css" />
    <title>Réservations</title>
</head>

<body>
  <div id="container">
    <div id = "header">
        <div id = "logo-container">
            Tickethack
        </div>
        <div id="nav-buttons">
            <button type ="button" id="btn-cart">Cart</button>
            <button type ="button" id="btn-bookings">Bookings</button>
        </div>
    </div>
    <div id = "content">
        <div id= "card">
                <p>Mes réservations</p>
                <div id="trip-card">
                    <span class="route">Lille > Lyon</span>
                    <span class="time">12:40</span>
                    <span class="price">99€</span>
                    <span class="countdown">Départ dans 11 heures</span>
                </div>
                <p id="greentext">Profitez de vos voyages avec Tickethack !</p>
        </div>
    </div>
    <div id = "footer"></div>
  </div>  
    
   <script src="script.js"></script> 
</body>
</html>
